name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "ci_scripts/**"
      - "output/shot_locations.parquet"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "ci_scripts/**"
      - "output/shot_locations.parquet"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Unit tests (no network required)
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # pyproject.toml sets pythonpath = ["src"], so no PYTHONPATH override needed.
        # Tests marked as needing network access are automatically skipped here
        # because the PDFs are not present on the runner.
        run: python -m pytest -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Detection accuracy evaluation (report-only, never fails the build)
  # Runs only when scraping or tracking code, CI scripts, or the manifest
  # changes.
  # ──────────────────────────────────────────────────────────────────────────
  evaluate-scraping:
    name: Evaluate Scraping Accuracy
    runs-on: ubuntu-latest
    # This job is report-only.  It uploads metrics as an artifact but never
    # fails the build — even if evaluation produces poor results.
    continue-on-error: true

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (
        contains(toJSON(github.event.head_commit.modified), 'src/scraping/') ||
        contains(toJSON(github.event.head_commit.modified), 'src/tracking/') ||
        contains(toJSON(github.event.head_commit.modified), 'ci_scripts/')
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List available sample PDFs
        run: |
          echo "PDFs present in 'example raw data/':"
          ls -lh "example raw data/" 2>/dev/null || echo "  (directory empty or absent)"

      - name: Run detection evaluation
        # PYTHONPATH not needed — ci_scripts/evaluate_all.py adds src/ itself.
        # Evaluation skips any PDF listed in the manifest that is not present,
        # so this step succeeds even if no PDFs have been committed.
        run: |
          python ci_scripts/evaluate_all.py \
            --manifest tests/eval_manifest.json \
            --pdf-dir "example raw data" \
            --out ci_scripts/evaluation_results/metrics.json

      - name: Check regressions against baseline
        if: always()
        run: |
          python ci_scripts/check_regression.py \
            --current  ci_scripts/evaluation_results/metrics.json \
            --baseline ci_scripts/evaluation_results/baseline_scraping.json \
            --markdown ci_scripts/evaluation_results/regression_report.md

      - name: Upload evaluation metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-metrics-${{ github.run_id }}
          path: ci_scripts/evaluation_results/
          retention-days: 90

      - name: Write step summary
        if: always()
        run: |
          if [ -f ci_scripts/evaluation_results/metrics.json ]; then
            python ci_scripts/print_metrics.py \
              ci_scripts/evaluation_results/metrics.json --markdown \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "No metrics file produced." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f ci_scripts/evaluation_results/regression_report.md ]; then
            cat ci_scripts/evaluation_results/regression_report.md \
              >> $GITHUB_STEP_SUMMARY
          fi

      - name: Print metrics summary to job log
        if: always()
        run: |
          if [ -f ci_scripts/evaluation_results/metrics.json ]; then
            python ci_scripts/print_metrics.py ci_scripts/evaluation_results/metrics.json
          else
            echo "No metrics file produced."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Stone tracking quality evaluation (report-only, never fails build)
  # Runs when tracking code or the output parquet changes.
  # ──────────────────────────────────────────────────────────────────────────
  evaluate-tracking:
    name: Evaluate Tracking Quality
    runs-on: ubuntu-latest
    continue-on-error: true

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (
        contains(toJSON(github.event.head_commit.modified), 'src/tracking/') ||
        contains(toJSON(github.event.head_commit.modified), 'output/shot_locations') ||
        contains(toJSON(github.event.head_commit.modified), 'ci_scripts/')
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for tracked parquet
        run: |
          if [ -f output/shot_locations.parquet ]; then
            echo "Found output/shot_locations.parquet"
            python -c "
          import pandas as pd
          df = pd.read_parquet('output/shot_locations.parquet')
          print(f'  {len(df):,} rows')
          "
          else
            echo "output/shot_locations.parquet not present — evaluation will skip."
          fi

      - name: Run tracking evaluation
        run: |
          python ci_scripts/evaluate_tracking.py \
            --out ci_scripts/evaluation_results/tracking_metrics.json \
            --markdown ci_scripts/evaluation_results/tracking_summary.md

      - name: Upload tracking metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-metrics-${{ github.run_id }}
          path: ci_scripts/evaluation_results/
          retention-days: 90

      - name: Write step summary
        if: always()
        run: |
          if [ -f ci_scripts/evaluation_results/tracking_summary.md ]; then
            cat ci_scripts/evaluation_results/tracking_summary.md \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "No tracking metrics produced (parquet absent)." \
              >> $GITHUB_STEP_SUMMARY
          fi
