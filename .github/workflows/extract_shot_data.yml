name: Extract Shot Data

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Single event PDF URL (leave blank to scrape all events)"
        required: false
        default: ""

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape result URLs
        if: ${{ github.event.inputs.pdf_url == '' }}
        run: python scrape_results.py --output-dir output

      - name: Extract shot data
        run: |
          if [ -n "${{ github.event.inputs.pdf_url }}" ]; then
            python extract_shot_data.py "${{ github.event.inputs.pdf_url }}" --output-dir output
          else
            python extract_shot_data.py --output-dir output
          fi

      - name: Commit and push updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update shot data [skip ci]"
            git push
          fi

      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shot-data-${{ github.run_id }}
          path: output/
          retention-days: 90
