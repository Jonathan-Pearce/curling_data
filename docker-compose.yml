services:
  curling:
    build: .
    image: curling_data:latest
    # Keep the container alive for interactive use; override on the command
    # line when you want to run a specific script (see examples below).
    stdin_open: true
    tty: true
    volumes:
      # Scraped / processed output persists on the host.
      - ./output:/app/output
      - ./output_test:/app/output_test
      # Place local PDF results books here; they will be available inside
      # the container at /app/example raw data/
      - "./example raw data:/app/example raw data"
    environment:
      - PYTHONPATH=/app/src

# ── Usage examples ────────────────────────────────────────────────────────────
#
#  Build the image:
#    docker compose build
#
#  Interactive shell:
#    docker compose run --rm curling
#
#  Scrape result URLs:
#    docker compose run --rm curling python src/scraping/scrape_results.py
#
#  Extract shot data (uses PDFs mounted from ./example raw data/):
#    docker compose run --rm curling python src/scraping/extract_shot_data.py
#
#  Run the test suite:
#    docker compose run --rm curling python -m pytest tests/ -v
